<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 170" role="img" aria-label="Soundways to Health">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&amp;family=Jost:wght@400&amp;display=swap');</style>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4C784"/>
      <stop offset=".48" stop-color="#E8A24A"/>
      <stop offset="1" stop-color="#5EB6C4"/>
    </linearGradient>
    <linearGradient id="still" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EB6C4"/>
      <stop offset="1" stop-color="#3A97A6"/>
    </linearGradient>
  </defs>
  <!-- So ligature : S looping through o, tracing infinity -->
  <g transform="translate(6,18) scale(0.92)">
    <circle cx="150" cy="60" r="40" fill="none" stroke="url(#still)" stroke-width="10.5"/>
    <path fill="none" stroke="url(#flow)" stroke-width="10.5" stroke-linecap="round"
          d="M 150 20
             C 132 21, 121 42, 110 60
             C 97 82, 84 100, 66 100
             C 42 100, 28 83, 28 60
             C 28 37, 42 20, 66 20
             C 84 20, 97 38, 110 60
             C 121 78, 132 99, 150 100"/>
    <circle cx="150" cy="60" r="5" fill="#F4C784"/>
  </g>
  <!-- undways -->
  <text x="212" y="112" font-family="'Cormorant Garamond',Georgia,serif" font-weight="500" font-size="104" fill="#F3EEE4" letter-spacing="1">undways</text>
  <!-- to health -->
  <text x="216" y="152" font-family="Jost,system-ui,sans-serif" font-weight="400" font-size="24" fill="#E8A24A" letter-spacing="14">TO HEALTH</text>
</svg>
