<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" role="img" aria-label="Soundways to Health mark — S and o forming an infinity">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4C784"/>
      <stop offset=".48" stop-color="#E8A24A"/>
      <stop offset="1" stop-color="#5EB6C4"/>
    </linearGradient>
    <linearGradient id="still" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EB6C4"/>
      <stop offset="1" stop-color="#3A97A6"/>
    </linearGradient>
  </defs>
  <!-- o : the vessel of silence -->
  <circle cx="150" cy="60" r="40" fill="none" stroke="url(#still)" stroke-width="10.5"/>
  <!-- S : one continuous breath, looping through the o to trace infinity -->
  <path fill="none" stroke="url(#flow)" stroke-width="10.5" stroke-linecap="round"
        d="M 150 20
           C 132 21, 121 42, 110 60
           C 97 82, 84 100, 66 100
           C 42 100, 28 83, 28 60
           C 28 37, 42 20, 66 20
           C 84 20, 97 38, 110 60
           C 121 78, 132 99, 150 100"/>
  <!-- bindu : Nishabdhaa, the still point within -->
  <circle cx="150" cy="60" r="5" fill="#F4C784"/>
</svg>
